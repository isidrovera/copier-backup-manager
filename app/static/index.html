<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1120">
<title>Copier Backup Manager</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;--bg:#0a1020;--surface:#111b2d;--panel:#151f32;--panel2:#1b2840;--line:#2b3b53;--text:#ecf3ff;--muted:#9aacc4;--blue:#738bff;--green:#49d6a1;--yellow:#f7c66f;--red:#ff7c87;--shadow:0 16px 48px #03071240}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}a{color:#a9b9ff}p{color:var(--muted);line-height:1.55}small,.muted{color:var(--muted)}h1{font-size:clamp(25px,3vw,34px);letter-spacing:-.04em;margin:0}h2{font-size:19px;letter-spacing:-.02em;margin:0}h3{font-size:15px;margin:0}code{color:#c5d0ff;overflow-wrap:anywhere}input:not([type=checkbox]),select,textarea{display:block;width:100%;background:#0e1829;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-height:45px}textarea{resize:vertical}input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue)}.hidden{display:none!important}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:#0d1627;display:flex;flex-direction:column;padding:26px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px;font-weight:800;letter-spacing:-.02em}.brand-symbol{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#8a9bff,#445be0);color:white;font-size:25px;box-shadow:0 7px 25px #405ce044}.brand small{display:block;margin-top:3px;letter-spacing:.05em;font-size:10px;font-weight:700;text-transform:uppercase}.section-label{font-size:10px;color:#7387a6;font-weight:800;text-transform:uppercase;letter-spacing:.13em;margin:14px 12px 8px}.nav{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:1px solid transparent;color:#a6b7cd;text-align:left;border-radius:11px;padding:12px 13px;margin:2px 0;font-weight:600;font-size:13px}.nav svg{width:18px;height:18px}.nav:hover{background:#18263e;color:#fff}.nav.active{background:#233455;border-color:#354c77;color:#fff}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}.side-note{border:1px solid #314766;background:#16243a;border-radius:12px;padding:14px;font-size:12px;color:#b0c2da;line-height:1.6}.side-note strong{color:#e6eeff}
.workspace{min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px clamp(18px,3vw,44px);border-bottom:1px solid var(--line)}.crumb{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:10px;align-items:center}.avatar{border:1px solid var(--line);background:var(--panel2);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:13px;font-weight:800}.content{max-width:1510px;margin:0 auto;padding:34px clamp(18px,3vw,44px) 70px}.headline{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:25px}.headline p{margin:7px 0 0;font-size:14px}.btn{border:1px solid transparent;background:var(--blue);color:#fff;border-radius:10px;padding:11px 16px;min-height:42px;font-weight:750;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;white-space:nowrap}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#243654;border-color:#395174}.btn.ghost{background:transparent;border-color:var(--line);color:#dce7fb}.btn.danger{background:#6a2938;color:#fff}.btn.small{min-height:35px;padding:7px 12px;font-size:12px}.buttons{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 28px #02061514}.metric{min-height:156px;position:relative;overflow:hidden}.metric-label{font-size:12px;color:#adbed3;font-weight:600}.metric-value{font-size:27px;font-weight:800;line-height:1.15;letter-spacing:-.035em;margin-top:19px;overflow-wrap:anywhere}.metric-meta{font-size:12px;color:#95a8c1;margin-top:13px}.metric-icon{position:absolute;right:17px;top:17px;background:#27395a;border:1px solid #354b70;border-radius:11px;width:39px;height:39px;display:grid;place-items:center;color:#b4c1ff}.metric-icon svg{width:19px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.pill{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid #425571;background:#27364e;color:#ccdcf4;border-radius:100px}.pill.success{background:#133e36;border-color:#296e59;color:#75e4b6}.pill.error{background:#4c2633;border-color:#7c3b48;color:#ffb0ba}.pill.warning{background:#4c3b24;border-color:#84653b;color:#ffd68d}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.hero{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;padding:26px;background:linear-gradient(110deg,#1b2b50,#17243e 65%,#202a54);border:1px solid #34476d;border-radius:18px;margin-bottom:18px;overflow:hidden}.hero h2{font-size:24px;margin:10px 0 8px}.hero p{max-width:560px;margin:0 0 17px}.hero-art{height:155px;position:relative;display:grid;place-items:center}.hero-art:before{content:'';width:155px;height:155px;border-radius:50%;border:1px solid #6b80bc66;box-shadow:0 0 0 30px #647de314,0 0 0 58px #647de30a}.hero-art svg{position:absolute;width:80px;height:80px;stroke:#bdcbff}.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(310px,.7fr);gap:18px}.stack{display:grid;gap:16px}.setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting p{font-size:12px;margin:4px 0 0}.empty{text-align:center;border:1px dashed #41516c;border-radius:14px;padding:38px 18px;color:var(--muted)}.empty .big-icon{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#263a58;margin:0 auto 12px;font-size:25px}.empty strong{display:block;color:var(--text);margin-bottom:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{color:#8fa4be;font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.065em}th,td{padding:15px 12px;border-bottom:1px solid var(--line)}td{color:#ccd8e9;vertical-align:middle}tr:last-child td{border-bottom:0}td:last-child{max-width:380px;overflow-wrap:anywhere}.field{display:grid;gap:8px;margin:15px 0}.field label{font-weight:650;font-size:12px;color:#cdd9ec}.hint{font-size:12px;color:#9eb1c9;line-height:1.5}.notice{border:1px solid #485e83;border-radius:12px;background:#1b2c47;color:#d2dff5;padding:14px 16px;font-size:13px;line-height:1.5;margin:12px 0}.notice.warning{background:#3b3125;border-color:#766044;color:#f6ddac}.notice.error{background:#482835;border-color:#854254;color:#ffc6ce}.notice.success{background:#153b35;border-color:#2c775e;color:#a9f3d4}.choice{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer}.choice:hover{background:#1c2b44}.choice b{font-size:13px}.choice small{display:block;margin-top:3px}.tabs{display:flex;gap:7px;padding:5px;border:1px solid var(--line);background:#101a2b;border-radius:12px;overflow-x:auto;margin-bottom:17px}.tab{background:transparent;border:0;color:#9fb0c7;border-radius:9px;padding:11px 14px;font-weight:700;white-space:nowrap;font-size:12px}.tab.active{background:#2b3f65;color:#fff}.inventory-card{border:1px solid var(--line);border-radius:12px;background:#111d30;padding:16px;margin:9px 0}.inventory-row{display:flex;align-items:center;justify-content:space-between;gap:14px}.inventory-row strong{font-size:13px}.inventory-row small{display:block;font-size:11px;margin-top:5px;overflow-wrap:anywhere}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.count{padding:14px;background:#1a2941;border:1px solid var(--line);border-radius:12px}.count strong{display:block;font-size:21px}.count small{font-size:11px}.auth{max-width:430px;margin:min(12vh,90px) auto;padding:18px}.auth .panel{padding:30px}.auth h1{font-size:24px;margin:10px 0}.auth .brand{padding:0}.toast-area{position:fixed;right:18px;bottom:20px;z-index:5;width:min(420px,calc(100vw - 36px))}.toast{padding:15px 17px;border-radius:12px;border:1px solid #40765c;background:#153c33;box-shadow:var(--shadow);margin-top:8px;font-size:13px}.toast.error{border-color:#a34a5b;background:#4a2533}.mobile-menu{display:none}.skeleton{opacity:.55}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1150px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-art{display:none}}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:11px 14px}.brand{padding:3px 4px 12px}.sidebar nav{display:flex;gap:5px;overflow-x:auto}.section-label,.side-bottom{display:none}.nav{width:auto;white-space:nowrap;flex-shrink:0}.topbar{padding:15px 18px}.content{padding:24px 15px 55px}.metrics,.grid,.counts{grid-template-columns:repeat(2,minmax(0,1fr))}.headline{align-items:start}.metric{min-height:145px}.metric-value{font-size:23px}.panel{padding:17px}}
@media(max-width:450px){.metrics,.counts,.grid{grid-template-columns:1fr}.top-actions .avatar{display:none}.headline{display:block}.headline .buttons{margin-top:15px}}
</style>
</head>
<body>
<div id="auth" class="auth hidden"><section class="panel"><div class="brand"><span class="brand-symbol">◈</span><div>Copier Backup <small>Manager · Acceso seguro</small></div></div><h1 id="authTitle">Bienvenido</h1><p id="authDesc"></p><form id="authForm"><div class="field"><label for="username">Usuario</label><input id="username" autocomplete="username" minlength="3" required></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" minlength="12" required></div><button class="btn" type="submit" id="authButton" style="width:100%">Continuar</button></form><div id="authError" role="alert" class="hint" style="margin-top:12px"></div></section></div>
<div id="shell" class="shell hidden"><aside class="sidebar"><div class="brand"><span class="brand-symbol">◈</span><div>Copier Backup<small>Infrastructure Manager</small></div></div><div class="section-label">General</div><nav aria-label="Navegación principal"><button class="nav active" data-page="dashboard">◫ &nbsp; Resumen</button><button class="nav" data-page="sources">▣ &nbsp; Orígenes</button><button class="nav" data-page="storage">☁ &nbsp; Almacenamiento</button><button class="nav" data-page="schedule">◷ &nbsp; Programación</button><button class="nav" data-page="restores">↺ &nbsp; Restauración</button><button class="nav" data-page="logs">☷ &nbsp; Logs y diagnóstico</button><button class="nav" data-page="security">♧ &nbsp; Seguridad</button></nav><div class="side-bottom"><div class="side-note"><strong>Protección por etapas</strong><br>Los orígenes Docker detectados no se respaldan hasta contar con un motor de copia consistente.</div></div></aside><div class="workspace"><header class="topbar"><div class="crumb">Infraestructura <span>›</span> <strong id="crumbPage" style="color:#eaf1fe">Resumen</strong></div><div class="top-actions"><span id="busyBadge" class="pill"><span class="dot"></span> Preparando</span><span class="avatar">CB</span><button class="btn ghost small" id="logoutButton">Salir</button></div></header><main class="content"><div class="headline"><div><h1 id="title">Resumen</h1><p id="subtitle">Tu centro de control de respaldos</p></div><div class="buttons"><button class="btn ghost small" id="refreshButton">↻ Actualizar</button></div></div><div id="content"></div></main></div></div><div id="toasts" class="toast-area" aria-live="polite"></div>
<script>
'use strict';
let csrf='',state={},page='dashboard',setupMode=false,discovery=null,inventoryTab='projects';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>{if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?String(s):new Intl.DateTimeFormat('es-PE',{dateStyle:'medium',timeStyle:'short',timeZone:'America/Lima'}).format(d)};
const statusLabel=s=>({success:'Completado',running:'En proceso',error:'Error',backup:'Respaldo',restore:'Restauración',check:'Verificación',test:'Conexión'})[s]||s||'Sin datos';
const badge=(text,kind='')=>`<span class="pill ${kind}"><span class="dot"></span>${esc(text)}</span>`;
function toast(message,error=false){let el=document.createElement('div');el.className='toast'+(error?' error':'');el.textContent=message;$('toasts').append(el);setTimeout(()=>el.remove(),6500)}
async function api(path,method='GET',data){let headers={};if(method!=='GET')headers['X-CSRF-Token']=csrf;if(data!==undefined)headers['Content-Type']='application/json';const r=await fetch('/api'+path,{method,credentials:'same-origin',headers,body:data===undefined?undefined:JSON.stringify(data)});let x;try{x=await r.json()}catch{x={detail:'Respuesta inesperada del servidor'}}if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:'Error HTTP '+r.status);return x}
async function boot(){try{const b=await api('/bootstrap');if(!b.authenticated){$('auth').classList.remove('hidden');$('shell').classList.add('hidden');setupMode=!!b.setup;$('authTitle').textContent=setupMode?'Configurar administrador':'Iniciar sesión';$('authDesc').textContent=setupMode?'Crea el primer usuario para proteger tu consola. Utiliza una contraseña de al menos 12 caracteres.':'Accede a la consola de copias y recuperación.';$('authButton').textContent=setupMode?'Crear administrador':'Entrar';return}csrf=b.csrf;$('auth').classList.add('hidden');$('shell').classList.remove('hidden');await refresh()}catch(e){$('authError').textContent=e.message}}
$('authForm').onsubmit=async e=>{e.preventDefault();$('authError').textContent='';try{let body={username:$('username').value,password:$('password').value};if(setupMode){await api('/setup','POST',body);setupMode=false}let r=await api('/login','POST',body);csrf=r.csrf;$('password').value='';await boot()}catch(err){$('authError').textContent=err.message}};
async function logout(){try{await api('/logout','POST')}catch(e){toast(e.message,true)}finally{csrf='';await boot()}}
$('logoutButton').onclick=logout;
$('refreshButton').onclick=()=>refresh().catch(e=>toast(e.message,true));
for(const n of document.querySelectorAll('.nav'))n.onclick=()=>{page=n.dataset.page;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b===n));render();if(page==='sources')fetchDiscovery();if(page==='logs')loadLogs()};
async function refresh(){state=await api('/status');$('busyBadge').outerHTML='';const h=document.createElement('span');h.id='busyBadge';h.className='pill '+(state.busy?'warning':'success');h.innerHTML='<span class="dot"></span>'+(state.busy?'Trabajando':'Sistema listo');document.querySelector('.avatar').before(h);render()}
function empty(title,description){return `<div class="empty"><div class="big-icon">◎</div><strong>${esc(title)}</strong><div>${esc(description)}</div></div>`}
function render(){const titles={dashboard:['Resumen general','Monitorea el estado, las copias y las actividades del sistema'],sources:['Orígenes de respaldo','Descubre aplicaciones y selecciona carpetas autorizadas'],storage:['Almacenamiento','Gestiona el destino de respaldo en pCloud'],schedule:['Programación','Configura ejecuciones automáticas y políticas'],restores:['Restauración','Explora puntos de recuperación y restaura con seguridad'],security:['Seguridad','Protege el acceso y las claves de recuperación'],logs:['Logs y diagnóstico','Actividad técnica, errores y estado del agente']};$('title').textContent=titles[page][0];$('subtitle').textContent=titles[page][1];$('crumbPage').textContent=titles[page][0];const c=$('content');if(page==='dashboard')renderDashboard(c);else if(page==='sources')renderSources(c);else if(page==='storage')renderStorage(c);else if(page==='schedule')renderSchedule(c);else if(page==='restores')renderRestore(c);else if(page==='logs')renderLogs(c);else renderSecurity(c)}
function renderDashboard(c){const last=state.runs?.[0];const ok=state.runs?.filter(x=>x.status==='success').length||0;const err=state.runs?.filter(x=>x.status==='error').length||0;c.innerHTML=`<section class="metrics"><div class="panel metric"><div class="metric-label">Destino de almacenamiento</div><div class="metric-icon">☁</div><div class="metric-value">${state.storage_configured?'pCloud':'Sin configurar'}</div><div class="metric-meta">${state.storage_configured?'Cuenta configurada':'Pendiente de conexión'}</div></div><div class="panel metric"><div class="metric-label">Carpetas protegidas</div><div class="metric-icon">▣</div><div class="metric-value">${state.selected?.length||0}</div><div class="metric-meta">Orígenes autorizados</div></div><div class="panel metric"><div class="metric-label">Ejecuciones correctas</div><div class="metric-icon">✓</div><div class="metric-value">${ok}</div><div class="metric-meta">Entre las últimas 30</div></div><div class="panel metric"><div class="metric-label">Ejecuciones con error</div><div class="metric-icon">!</div><div class="metric-value">${err}</div><div class="metric-meta">Entre las últimas 30</div></div></section><section class="hero"><div><span class="pill ${state.storage_configured?'success':'warning'}">${state.storage_configured?'Almacenamiento configurado':'Configuración pendiente'}</span><h2>Tu infraestructura, bajo control</h2><p>Administra respaldos cifrados, consulta el historial y prepara recuperaciones. La protección completa de Docker y Ubuntu se incorporará mediante un agente específico.</p><div class="buttons"><button class="btn" id="quickBackup" ${state.busy?'disabled':''}>＋ Crear respaldo</button><button class="btn secondary" id="quickTest" ${state.busy?'disabled':''}>Probar pCloud</button></div></div><div class="hero-art"><svg viewBox="0 0 100 100" fill="none" stroke-width="2.5"><rect x="18" y="17" width="64" height="23" rx="5"/><rect x="18" y="48" width="64" height="23" rx="5"/><circle cx="28" cy="29" r="3"/><circle cx="28" cy="59" r="3"/><path d="M44 29h27M44 59h27M50 71v12M33 83h34"/></svg></div></section><div class="split"><section class="panel"><div class="panel-title"><h2>Actividad reciente</h2>${badge(state.busy?'Operación en curso':'En espera',state.busy?'warning':'success')}</div>${runsTable(state.runs||[])}</section><section class="panel"><div class="panel-title"><h2>Estado de configuración</h2></div><div class="setting"><div><strong>pCloud</strong><p>Destino remoto de copias</p></div>${badge(state.storage_configured?'Configurado':'Pendiente',state.storage_configured?'success':'warning')}</div><div class="setting"><div><strong>Orígenes</strong><p>Carpetas seleccionadas</p></div><strong>${state.selected?.length||0}</strong></div><div class="setting"><div><strong>Programación</strong><p>Hora de Lima (UTC−5)</p></div>${badge(state.schedule?.enabled?'Activa':'Inactiva',state.schedule?.enabled?'success':'')}</div><div class="setting"><div><strong>Última operación</strong><p>${last?esc(fmtDate(last.started)):'Sin historial'}</p></div>${badge(last?statusLabel(last.status):'Sin datos',last?.status==='success'?'success':last?.status==='error'?'error':'')}</div></section></div>`;$('quickBackup').onclick=()=>run('backup');$('quickTest').onclick=()=>run('test')}
function runsTable(items){if(!items.length)return empty('Aún no hay ejecuciones','Cuando ejecutes un respaldo, aparecerá aquí.');return `<div class="tablewrap"><table><thead><tr><th>Fecha (Perú)</th><th>Operación</th><th>Estado</th><th>Detalle</th></tr></thead><tbody>${items.slice(0,15).map(r=>`<tr><td>${esc(fmtDate(r.started))}</td><td>${esc(statusLabel(r.operation))}</td><td>${badge(statusLabel(r.status),r.status==='success'?'success':r.status==='error'?'error':r.status==='running'?'warning':'')}</td><td>${esc(r.detail||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function renderSources(c){c.innerHTML=`<div class="tabs" role="tablist"><button class="tab active" data-st="folders">Carpetas autorizadas</button><button class="tab" data-st="discovery">Docker y Dokploy</button></div><div id="sourceBody"></div>`;c.querySelectorAll('[data-st]').forEach(t=>t.onclick=()=>{c.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('active',x===t));if(t.dataset.st==='folders')renderSourceFolders();else renderDiscovery()});renderSourceFolders()}
function renderSourceFolders(){const b=$('sourceBody');if(!b)return;b.innerHTML=`<div class="split"><section class="panel"><div class="panel-title"><h2>Carpetas disponibles</h2>${badge((state.sources||[]).length+' disponibles')}</div><p class="hint">Por seguridad, aquí solo aparecen carpetas montadas en <code>/sources</code>. La detección Docker es independiente y no implica copia automática.</p><form id="sourceForm">${(state.sources||[]).length?state.sources.map(n=>`<label class="choice"><input type="checkbox" name="source" value="${esc(n)}" ${(state.selected||[]).includes(n)?'checked':''}><div><b>/${esc(n)}</b><small>Carpeta de solo lectura</small></div></label>`).join(''):empty('No hay carpetas disponibles','Monta una carpeta autorizada en Dokploy para realizar backups de archivos.')}<button class="btn" type="submit">Guardar selección</button></form></section><section class="panel"><h2>¿Cómo funciona?</h2><div class="notice">Solo se respaldan carpetas seleccionadas explícitamente. No se copia automáticamente todo el servidor ni las bases de datos activas.</div><p class="hint">Para respaldar PostgreSQL con consistencia o migrar Dokploy necesitaremos el motor especializado del agente Linux.</p></section></div>`;$('sourceForm').onsubmit=async e=>{e.preventDefault();try{await api('/sources','POST',{paths:[...document.querySelectorAll('[name=source]:checked')].map(x=>x.value)});await refresh();toast('Selección guardada correctamente')}catch(ex){toast(ex.message,true)}}}
async function fetchDiscovery(){try{discovery=await api('/discovery');if(page==='sources'&&document.querySelector('[data-st="discovery"].active'))renderDiscovery()}catch(ex){discovery={error:ex.message};if(page==='sources'&&document.querySelector('[data-st="discovery"].active'))renderDiscovery()}}
function inventoryRows(items,type){if(!Array.isArray(items)||!items.length)return empty('Sin registros','El inventario no contiene elementos de esta categoría.');return items.map((it,i)=>{if(typeof it!=='object'||!it)return '';const name=it.name||it.Name||it.project||it.id||it.Id||('Elemento '+(i+1));const detail=[it.image,it.status,it.driver,it.mountpoint,it.compose_file,it.config_files,it.compose_files,it.path].filter(Boolean).join(' · ');return `<div class="inventory-card"><div class="inventory-row"><div><strong>${esc(name)}</strong><small>${esc(detail||type)}</small></div>${badge(type)}</div></div>`}).join('')}
function renderDiscovery(){const b=$('sourceBody');if(!b)return;if(!discovery){b.innerHTML='<div class="panel">Cargando inventario Docker…</div>';fetchDiscovery();return}if(discovery.error||discovery.ready===false){b.innerHTML=`<section class="panel">${empty('Inventario todavía no disponible','El agente aún no ha publicado un inventario válido.')}<div class="notice warning">${esc(discovery.error||discovery.message||'No se ha generado el inventario.')}</div><button class="btn secondary" id="reloadInventory">Reintentar</button></section>`;$('reloadInventory').onclick=fetchDiscovery;return}const obj=discovery.inventory||discovery.data||discovery;const groups={projects:obj.projects||obj.compose_projects||[],containers:obj.containers||[],volumes:obj.volumes||[],networks:obj.networks||[],images:obj.images||[]};const warning=discovery.stale||discovery.status==='stale';b.innerHTML=`<section class="panel"><div class="panel-title"><h2>Inventario de Docker y Dokploy</h2>${badge(warning?'Datos antiguos':'Modo lectura',warning?'warning':'success')}</div><p class="hint">Los datos provienen de un agente Linux separado. Este panel no administra Docker ni dispone del socket del host.</p><div class="counts">${[['Proyectos',groups.projects.length],['Contenedores',groups.containers.length],['Volúmenes',groups.volumes.length],['Redes',groups.networks.length]].map(([n,v])=>`<div class="count"><strong>${v}</strong><small>${n}</small></div>`).join('')}</div><div class="notice warning">La detección todavía no activa backups de contenedores o PostgreSQL. Evita asumir que estos servicios están protegidos.</div><div class="tabs" id="inventoryTabs">${[['projects','Proyectos'],['containers','Contenedores'],['volumes','Volúmenes'],['networks','Redes'],['images','Imágenes']].map(([k,n])=>`<button class="tab ${inventoryTab===k?'active':''}" data-it="${k}">${n} (${groups[k].length})</button>`).join('')}</div><div id="inventoryList">${inventoryRows(groups[inventoryTab],inventoryTab)}</div><button class="btn ghost small" id="inventoryRefresh">↻ Actualizar inventario</button></section>`;b.querySelectorAll('[data-it]').forEach(btn=>btn.onclick=()=>{inventoryTab=btn.dataset.it;renderDiscovery()});$('inventoryRefresh').onclick=fetchDiscovery}
function renderStorage(c){c.innerHTML=`<div class="grid"><section class="panel"><div class="panel-title"><h2>Conectar pCloud</h2>${badge(state.storage_configured?'Configurado':'Pendiente',state.storage_configured?'success':'warning')}</div><p class="hint">El token no se almacena en GitHub. La versión actual solicita el JSON OAuth generado mediante <code>rclone authorize pcloud</code>; el botón OAuth directo todavía no está implementado.</p><form id="storageForm"><div class="field"><label for="region">Región de pCloud</label><select id="region"><option value="global">Global</option><option value="eu">Europa</option></select></div><div class="field"><label for="folder">Carpeta de destino</label><input id="folder" required maxlength="180"></div><div class="field"><label for="token">Token OAuth (JSON)</label><textarea id="token" rows="5" placeholder='{"access_token":"..."}' spellcheck="false"></textarea></div><div class="buttons"><button class="btn" type="submit">Guardar conexión</button><button class="btn secondary" type="button" id="testStorage">Probar conexión</button></div></form></section><section class="panel"><h2>Protección de credenciales</h2><div class="notice">Los tokens se cifran en el almacenamiento persistente. Nunca los subas al repositorio ni los compartas en capturas.</div><p class="hint">Para recuperar backups tras perder el servidor necesitarás conservar de forma segura la contraseña de Restic y la configuración de acceso.</p><div class="setting"><div><strong>Destino</strong><p>pCloud / ${esc(state.folder)}</p></div>${badge(state.storage_configured?'Configurado':'Pendiente',state.storage_configured?'success':'warning')}</div></section></div>`;$('region').value=state.region||'global';$('folder').value=state.folder||'CopierBackupManager';$('storageForm').onsubmit=async e=>{e.preventDefault();try{await api('/storage','POST',{region:$('region').value,folder:$('folder').value,token:$('token').value});$('token').value='';await refresh();toast('Credenciales almacenadas de forma cifrada')}catch(ex){toast(ex.message,true)}};$('testStorage').onclick=()=>run('test')}
function renderSchedule(c){const s=state.schedule||{};c.innerHTML=`<div class="split"><section class="panel"><div class="panel-title"><h2>Plan de respaldo</h2>${badge(s.enabled?'Activo':'Desactivado',s.enabled?'success':'')}</div><form id="scheduleForm"><label class="choice"><input type="checkbox" id="enabled" ${s.enabled?'checked':''}><div><b>Activar copia diaria</b><small>Se ejecuta según la hora de Lima, Perú</small></div></label><div class="grid"><div class="field"><label for="hour">Hora (0–23)</label><input type="number" id="hour" min="0" max="23" required value="${Number(s.hour??2)}"></div><div class="field"><label for="minute">Minuto</label><input type="number" id="minute" min="0" max="59" required value="${Number(s.minute??0)}"></div></div><div class="field"><label for="retention">Retención prevista (días)</label><input type="number" id="retention" min="1" max="3650" required value="${Number(s.retention_days??30)}"></div><div class="notice warning">La retención se almacena como preferencia, pero esta versión no elimina automáticamente respaldos antiguos.</div><button class="btn" type="submit">Guardar programación</button></form></section><section class="panel"><h2>Antes de activar</h2><p>Comprueba que el destino remoto esté configurado y que exista al menos una carpeta seleccionada.</p><div class="setting"><div><strong>pCloud</strong><p>Configuración remota</p></div>${badge(state.storage_configured?'OK':'Pendiente',state.storage_configured?'success':'warning')}</div><div class="setting"><div><strong>Orígenes</strong><p>Carpetas seleccionadas</p></div>${badge((state.selected||[]).length+' carpetas')}</div></section></div>`;$('scheduleForm').onsubmit=async e=>{e.preventDefault();try{await api('/schedule','POST',{enabled:$('enabled').checked,hour:Number($('hour').value),minute:Number($('minute').value),retention_days:Number($('retention').value)});await refresh();toast('Programación guardada')}catch(ex){toast(ex.message,true)}}}
function renderRestore(c){c.innerHTML=`<section class="panel"><div class="panel-title"><h2>Puntos de recuperación</h2><button class="btn secondary" id="loadRestore">Consultar copias</button></div><p>Selecciona un snapshot de Restic. Las restauraciones actuales se extraen en <code>/data/restored</code> sin sobrescribir los archivos originales.</p><div class="notice warning">No restaures bases de datos ni sistemas completos desde aquí: esta pantalla solo recupera archivos del repositorio.</div><div id="snapshots">${empty('Aún no se han consultado las copias','Pulsa Consultar copias para mostrar los snapshots disponibles.')}</div></section>`;$('loadRestore').onclick=loadSnapshots}
function renderSecurity(c){c.innerHTML=`<div class="grid"><section class="panel"><h2>Credenciales y cifrado</h2><div class="setting"><div><strong>Clave maestra</strong><p>Almacenada en /data/master.key</p></div>${badge(state.recovery_key_saved?'Presente':'No disponible',state.recovery_key_saved?'success':'error')}</div><div class="setting"><div><strong>Sesión autenticada</strong><p>Cookie segura y validación CSRF</p></div>${badge('Activa','success')}</div><div class="notice warning">Conserva una copia protegida de la clave maestra, la contraseña Restic y los datos de acceso a pCloud. No las incluyas en GitHub.</div></section><section class="panel"><h2>Alcance actual</h2><p>El panel web no tiene permisos directos para modificar Docker ni discos de Ubuntu. La detección se realiza mediante un agente independiente.</p><div class="notice">La restauración completa de Ubuntu y las migraciones entre VPS no están disponibles todavía. Requieren un procedimiento de rescate probado.</div><p class="hint">Publica este panel solo con HTTPS y añade una capa de control de acceso en el proxy si es posible.</p></section></div>`}
let logLevel='', logComponent='';
function renderLogs(c){c.innerHTML=`<div class="grid"><section class="panel"><div class="panel-title"><h2>Diagnóstico de infraestructura</h2><button class="btn ghost small" id="diagReload">↻ Diagnosticar</button></div><div id="diagnosticResult" class="hint">Consultando el estado...</div></section><section class="panel"><h2>Registro y seguridad</h2><p class="hint">Los eventos de esta aplicación se guardan en SQLite durante 30 días (máximo 10.000 registros). El agente Linux emite sus logs a stderr/journal del host, no directamente a este panel.</p><div class="notice warning">No compartas logs sin revisar la información sensible. Los mensajes comunes se filtran, pero ninguna técnica de redacción automática es perfecta.</div></section></div><section class="panel" style="margin-top:18px"><div class="panel-title"><h2>Actividad y errores</h2><div class="buttons"><button class="btn secondary small" id="logsReload">↻ Actualizar</button><button class="btn ghost small" id="logsExport">↓ Exportar JSONL</button></div></div><div class="grid"><div class="field"><label>Nivel</label><select id="logLevel"><option value="">Todos</option><option>INFO</option><option>WARNING</option><option>ERROR</option></select></div><div class="field"><label>Componente</label><select id="logComponent"><option value="">Todos</option><option value="app">Aplicación</option><option value="backup">Backups</option><option value="pcloud">pCloud</option><option value="sources">Orígenes</option><option value="schedule">Programación</option><option value="security">Seguridad</option></select></div></div><div class="tablewrap"><table><thead><tr><th>Fecha (Perú)</th><th>Nivel</th><th>Componente</th><th>Mensaje</th></tr></thead><tbody id="logRows"><tr><td colspan="4">Cargando registros...</td></tr></tbody></table></div></section>`;$('logsReload').onclick=loadLogs;$('diagReload').onclick=loadDiagnostics;$('logLevel').value=logLevel;$('logComponent').value=logComponent;$('logLevel').onchange=e=>{logLevel=e.target.value;loadLogs()};$('logComponent').onchange=e=>{logComponent=e.target.value;loadLogs()};$('logsExport').onclick=async()=>{try{const res=await fetch('/api/logs/export',{credentials:'same-origin'});if(!res.ok)throw Error('No se pudo exportar');const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cbm-events.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){toast(e.message,true)}};loadDiagnostics()}
async function loadLogs(){const body=$('logRows');if(!body)return;try{const r=await api('/logs?'+new URLSearchParams({level:logLevel,component:logComponent,limit:'200'}));body.innerHTML=r.items.length?r.items.map(x=>`<tr><td>${esc(fmtDate(x.created))}</td><td>${badge(x.level,x.level==='ERROR'?'error':x.level==='WARNING'?'warning':'success')}</td><td>${esc(x.component)}</td><td>${esc(x.message)}</td></tr>`).join(''):'<tr><td colspan="4">Sin registros para estos filtros.</td></tr>'}catch(e){body.innerHTML='<tr><td colspan="4">'+esc(e.message)+'</td></tr>'}}
async function loadDiagnostics(){const el=$('diagnosticResult');if(!el)return;try{const r=await api('/diagnostics');let i=r.inventory;el.innerHTML=`<div class="setting"><div><strong>Inventario Docker</strong><p>${esc(i.message)}</p></div>${badge(i.ready?'Disponible':'Pendiente',i.ready?'success':'warning')}</div><div class="setting"><div><strong>Archivo inventario</strong><p>${i.exists?'Existe':'No existe'} · ${i.readable?'Legible':'No legible'}</p></div>${badge(i.exists&&i.readable?'OK':'Revisar',i.exists&&i.readable?'success':'warning')}</div><div class="setting"><div><strong>pCloud</strong><p>${r.storage_configured?'Configurado':'Sin configurar'}</p></div></div><div class="setting"><div><strong>Carpetas montadas</strong><p>${Number(r.source_count)} disponibles</p></div></div>${i.generated_at?'<p class="hint">Última publicación: '+esc(fmtDate(i.generated_at))+'</p>':''}` }catch(e){el.textContent=e.message}}
async function run(op){try{await api('/jobs/'+op,'POST');toast('Trabajo solicitado. Revisa la actividad reciente.');setTimeout(()=>refresh().catch(()=>{}),900);setTimeout(()=>refresh().catch(()=>{}),4000)}catch(ex){toast(ex.message,true)}}
async function loadSnapshots(){const b=$('snapshots');if(!b)return;b.innerHTML='<p class="muted">Consultando repositorio remoto…</p>';try{const arr=await api('/snapshots');b.innerHTML=arr.length?arr.map(s=>`<div class="inventory-card inventory-row"><div><strong>${esc(s.short_id||s.id)}</strong><small>${esc(fmtDate(s.time))} · ${esc((s.paths||[]).join(', '))}</small></div><button class="btn ghost small" data-snapshot="${esc(s.id)}">Restaurar</button></div>`).join(''):empty('Sin instantáneas','Todavía no hay snapshots disponibles en el repositorio.');b.querySelectorAll('[data-snapshot]').forEach(btn=>btn.onclick=async()=>{if(!confirm('¿Restaurar esta copia en una carpeta nueva sin sobrescribir el origen?'))return;try{await api('/restore','POST',{snapshot:btn.dataset.snapshot});toast('Restauración solicitada. Revisa el historial.') }catch(ex){toast(ex.message,true)}})}catch(ex){b.innerHTML='<div class="notice error">'+esc(ex.message)+'</div>'}}
boot();setInterval(()=>{if(!$('shell').classList.contains('hidden')&&page==='dashboard')refresh().catch(()=>{})},15000);
</script>
</body></html>
