<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copier Backup Manager</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9eef7;background:#0c1322}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{background:#101a2c;color:#fff;border:1px solid #35425a;border-radius:10px;padding:12px;width:100%;outline:none}input:focus,textarea:focus{border-color:#7d91fe}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#111c2d;border-right:1px solid #26354a;padding:28px 16px}.brand{display:flex;gap:12px;align-items:center;padding:0 12px 30px;font-weight:800;font-size:18px}.brand span.logo{background:#5869de;border-radius:12px;padding:10px}.nav{display:block;width:100%;border:0;background:transparent;color:#99aabe;text-align:left;padding:14px;border-radius:10px;margin-bottom:4px}.nav.active,.nav:hover{background:#263754;color:white}.main{max-width:1200px;width:100%;padding:38px 44px;margin:auto}h1{margin:0 0 6px;font-size:29px}h2{font-size:20px;margin:0 0 18px}p{color:#a5b5ca;line-height:1.5}small,.muted{color:#92a4b9}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.card{background:#162236;border:1px solid #2a3a51;border-radius:17px;padding:23px;box-shadow:0 10px 35px #050a1324}.metric{font-size:34px;font-weight:800;margin-top:12px}.tag{background:#263b45;color:#8ae6bb;border-radius:25px;padding:5px 10px;font-size:12px}.btn{border:0;border-radius:11px;background:#6579fa;color:#fff;padding:12px 18px;font-weight:700}.btn:hover{background:#7889fb}.btn.outline{background:transparent;border:1px solid #415470}.btn.red{background:#a63c45}.stack{display:grid;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.notice{border:1px solid #475977;background:#202e43;padding:15px;border-radius:12px;color:#cfddf2;font-size:14px}.alert{background:#4e2630;color:#ffd4d7;border-color:#93414d}.ok{background:#153e34;color:#a6f3cd;border-color:#397d6a}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:14px;border-bottom:1px solid #2d3d55}th{color:#8296b1;font-weight:600}.pill{display:inline-block;border-radius:20px;padding:5px 10px;background:#303c4d;color:#c8d6ed}.pill.success{background:#164734;color:#a2edc6}.pill.error{background:#582b32;color:#ffc2cb}.source{padding:14px;border:1px solid #354962;border-radius:11px;margin:8px 0;display:flex;gap:10px;align-items:center}.source input{width:auto}.auth{max-width:440px;margin:10vh auto}.auth .card{padding:30px}.hidden{display:none!important}.subtitle{margin-top:0}code{color:#d9ddff;overflow-wrap:anywhere}a{color:#b3befd}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{padding:12px;display:flex;overflow:auto;align-items:center;gap:4px}.brand{padding:4px 15px}.nav{width:auto;white-space:nowrap;margin:0}.main{padding:24px 15px}.cards,.grid{grid-template-columns:1fr}}
</style></head><body><div id="auth" class="auth hidden"><div class="card"><div class="brand" style="padding:0 0 20px"><span class="logo">◈</span> Copier Backup Manager</div><h2 id="authTitle">Bienvenido</h2><p id="authDesc"></p><form id="authForm"><label class="field">Usuario<input id="username" autocomplete="username" minlength="3" required></label><label class="field">Contraseña<input id="password" type="password" autocomplete="current-password" minlength="12" required></label><button class="btn" style="width:100%" type="submit" id="authButton">Continuar</button></form><p id="authError"></p></div></div>
<div id="shell" class="shell hidden"><aside class="side"><div class="brand"><span class="logo">◈</span> Copier Backup</div><button class="nav active" data-page="dashboard">◫ &nbsp; Resumen</button><button class="nav" data-page="sources">▣ &nbsp; Orígenes</button><button class="nav" data-page="storage">☁ &nbsp; pCloud</button><button class="nav" data-page="schedule">◷ &nbsp; Programación</button><button class="nav" data-page="restores">↺ &nbsp; Restauración</button><button class="nav" data-page="security">♙ &nbsp; Seguridad</button></aside><main class="main"><div class="top"><div><h1 id="title">Resumen</h1><p class="subtitle" id="subtitle">Estado de tus respaldos y actividades</p></div><button class="btn outline" onclick="logout()">Salir</button></div><div id="msg"></div><div id="content"></div></main></div>
<script>
let csrf='', state={}, page='dashboard', setupMode=false; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',data){const opts={method,credentials:'same-origin',headers:{}};if(method!=='GET')opts.headers['X-CSRF-Token']=csrf;if(data!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(data)}const r=await fetch('/api'+path,opts);let x;try{x=await r.json()}catch{x={detail:'Respuesta inválida'}}if(!r.ok)throw Error(x.detail||'Error HTTP '+r.status);return x}
function notice(msg,error=false){$('msg').innerHTML=`<div class="notice ${error?'alert':'ok'}" style="margin-bottom:18px">${esc(msg)}</div>`;setTimeout(()=>{$('msg').innerHTML=''},7000)}
async function boot(){try{let b=await api('/bootstrap');if(!b.authenticated){$('auth').classList.remove('hidden');$('shell').classList.add('hidden');setupMode=!!b.setup;$('authTitle').textContent=setupMode?'Crear administrador':'Iniciar sesión';$('authDesc').textContent=setupMode?'Primera instalación: crea tu usuario y contraseña (12 caracteres mínimo).':'Accede a tu consola privada de respaldos';$('authButton').textContent=setupMode?'Crear cuenta':'Ingresar';return}csrf=b.csrf;$('auth').classList.add('hidden');$('shell').classList.remove('hidden');await refresh()}catch(e){$('authError').textContent=e.message}}
$('authForm').onsubmit=async e=>{e.preventDefault();try{const x={username:$('username').value,password:$('password').value};if(setupMode){await api('/setup','POST',x);setupMode=false}const r=await api('/login','POST',x);csrf=r.csrf;await boot()}catch(ex){$('authError').textContent=ex.message}};
async function logout(){try{await api('/logout','POST')}finally{csrf='';await boot()}}
for(const el of document.querySelectorAll('.nav'))el.onclick=()=>{page=el.dataset.page;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===el));render()};
async function refresh(){state=await api('/status');render()}
function render(){const titles={dashboard:['Resumen','Tu centro de control de copias'],sources:['Orígenes','Selecciona carpetas de lectura autorizadas'],storage:['Almacenamiento pCloud','Conexión cifrada con tu cuenta'],schedule:['Programación','Copias automáticas según horario de Perú'],restores:['Restauración','Recupera copias en una carpeta aislada'],security:['Seguridad','Protección y recuperación de tus credenciales']};$('title').textContent=titles[page][0];$('subtitle').textContent=titles[page][1];const c=$('content');if(page==='dashboard'){let last=state.runs[0];c.innerHTML=`<div class="cards"><div class="card"><small>Almacenamiento</small><div class="metric" style="font-size:22px">${state.storage_configured?'pCloud':'Sin configurar'}</div><p>Destino remoto</p></div><div class="card"><small>Orígenes seleccionados</small><div class="metric">${state.selected.length}</div><p>Carpetas protegidas</p></div><div class="card"><small>Última actividad</small><div class="metric" style="font-size:21px">${last?esc(last.status):'Sin ejecuciones'}</div><p>${last?esc(last.operation):'Sin respaldos previos'}</p></div></div><div class="card"><div class="row"><h2>Acciones rápidas</h2><span class="tag">${state.busy?'Trabajando':'Listo'}</span></div><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" onclick="run('backup')" ${state.busy?'disabled':''}>Crear respaldo</button><button class="btn outline" onclick="run('test')" ${state.busy?'disabled':''}>Probar pCloud</button><button class="btn outline" onclick="run('check')" ${state.busy?'disabled':''}>Verificar repositorio</button></div><p>Solo se respaldan orígenes expresamente seleccionados. No se copia todo Ubuntu en esta versión.</p></div><div class="card" style="margin-top:18px"><h2>Historial</h2><div class="tablewrap"><table><thead><tr><th>Fecha UTC</th><th>Operación</th><th>Estado</th><th>Detalle</th></tr></thead><tbody>${state.runs.length?state.runs.map(r=>`<tr><td>${esc(r.started)}</td><td>${esc(r.operation)}</td><td><span class="pill ${esc(r.status)}">${esc(r.status)}</span></td><td>${esc(r.detail)}</td></tr>`).join(''):'<tr><td colspan="4">Todavía no existen ejecuciones.</td></tr>'}</tbody></table></div></div>`}
else if(page==='sources'){c.innerHTML=`<div class="card"><h2>Carpetas disponibles</h2><p>Por seguridad solo se muestran las carpetas montadas en <code>/sources</code>. No hay acceso automático a Docker ni al disco raíz.</p><form id="sourceForm">${state.sources.length?state.sources.map(n=>`<label class="source"><input type="checkbox" name="source" value="${esc(n)}" ${state.selected.includes(n)?'checked':''}><span>/${esc(n)}</span></label>`).join(''):'<div class="notice">No hay carpetas disponibles. Debes montar explícitamente rutas de solo lectura desde Dokploy.</div>'}<button class="btn" type="submit">Guardar selección</button></form></div>`;$('sourceForm').onsubmit=async e=>{e.preventDefault();try{await api('/sources','POST',{paths:[...document.querySelectorAll('[name=source]:checked')].map(x=>x.value)});await refresh();notice('Selección guardada')}catch(e){notice(e.message,true)}}}
else if(page==='storage'){c.innerHTML=`<div class="card"><h2>Conectar pCloud</h2><p>No se guardan claves en GitHub. Autoriza pCloud desde un equipo con Rclone mediante <code>rclone authorize pcloud</code>, copia el JSON OAuth obtenido y pégalo aquí. Evita compartirlo con otras personas.</p><form id="storageForm"><label class="field">Región<select id="region"><option value="global">Global</option><option value="eu">Europa</option></select></label><label class="field">Carpeta de backups en pCloud<input id="folder" required></label><label class="field">Token OAuth (JSON) <textarea id="token" rows="5" placeholder='{"access_token":"...","token_type":"Bearer",...}'></textarea></label><div class="row" style="justify-content:flex-start"><button class="btn" type="submit">Guardar conexión</button><button class="btn outline" type="button" onclick="run('test')">Probar conexión</button></div></form><p class="muted">El token actual nunca se devuelve por la API ni se muestra de nuevo.</p></div>`;$('region').value=state.region;$('folder').value=state.folder;$('storageForm').onsubmit=async e=>{e.preventDefault();try{await api('/storage','POST',{region:$('region').value,folder:$('folder').value,token:$('token').value});$('token').value='';await refresh();notice('Conexión almacenada cifrada')}catch(e){notice(e.message,true)}}}
else if(page==='schedule'){let s=state.schedule;c.innerHTML=`<div class="card"><h2>Automatización</h2><form id="scheduleForm"><label class="source"><input type="checkbox" id="enabled" ${s.enabled?'checked':''}> Activar copia diaria</label><div class="grid"><label class="field">Hora (Perú)<input id="hour" type="number" min="0" max="23" value="${s.hour}"></label><label class="field">Minuto<input id="minute" type="number" min="0" max="59" value="${s.minute}"></label></div><label class="field">Política de retención (días)<input id="retention" type="number" min="1" max="3650" value="${s.retention_days}"></label><p class="muted">La retención se almacena como política, pero no ejecuta eliminación automática en esta versión inicial, para evitar pérdida accidental de copias.</p><button type="submit" class="btn">Guardar programación</button></form></div>`;$('scheduleForm').onsubmit=async e=>{e.preventDefault();try{await api('/schedule','POST',{enabled:$('enabled').checked,hour:Number($('hour').value),minute:Number($('minute').value),retention_days:Number($('retention').value)});await refresh();notice('Programación guardada')}catch(e){notice(e.message,true)}}}
else if(page==='restores'){c.innerHTML=`<div class="card"><h2>Instantáneas disponibles</h2><p>La restauración solo extrae archivos a <code>/data/restored</code>; nunca reemplaza los originales. El destino debe tener capacidad suficiente.</p><button class="btn outline" onclick="loadSnapshots()">Consultar copias</button><div id="snapshots" style="margin-top:20px"></div></div>`}
else{c.innerHTML=`<div class="card"><h2>Protección de datos</h2><div class="notice">La contraseña de Restic y los tokens están cifrados usando <code>/data/master.key</code>. Debes conservar una copia segura de la clave maestra, la contraseña del repositorio Restic y la configuración de restauración fuera del servidor. No publiques esos archivos.</div><p>Las copias de esta versión solo contienen carpetas seleccionadas. Para recuperación completa de Ubuntu, bases de datos consistentes y migraciones de VPS se requiere un agente Linux adicional y pruebas de restauración.</p><p>El acceso web debe publicarse exclusivamente con HTTPS y controles de acceso apropiados.</p></div>`}}
async function run(op){try{await api('/jobs/'+op,'POST');notice('Trabajo solicitado; revisa el historial');setTimeout(refresh,800);setTimeout(refresh,3500)}catch(e){notice(e.message,true)}}
async function loadSnapshots(){const b=$('snapshots');b.textContent='Consultando repositorio...';try{let items=await api('/snapshots');b.innerHTML=items.length?items.map(s=>`<div class="source"><div style="flex:1"><b>${esc(s.short_id||s.id)}</b><div class="muted">${esc(s.time)} · ${esc((s.paths||[]).join(', '))}</div></div><button class="btn outline" data-id="${esc(s.id)}">Recuperar</button></div>`).join(''):'No hay instantáneas';b.querySelectorAll('button[data-id]').forEach(el=>el.onclick=async()=>{if(!confirm('¿Recuperar esta copia en un directorio nuevo, sin modificar el origen?'))return;try{await api('/restore','POST',{snapshot:el.dataset.id});notice('Restauración solicitada; revisa el historial')}catch(e){notice(e.message,true)}})}catch(e){b.textContent=e.message}}
boot();setInterval(async()=>{if(!$('shell').classList.contains('hidden')&&page==='dashboard')try{await refresh()}catch{}},10000);
</script></body></html>
