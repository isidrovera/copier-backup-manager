
services:
  backup-manager:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      TZ: America/Lima
      CBM_DATA: /data
      CBM_SOURCES: /sources

    volumes:
      # Configuración, usuarios, claves y base de datos
      - cbm_data:/data

      # Restauraciones aisladas
      - cbm_restores:/data/restored

      # Carpeta de pruebas
      - ./sample-data:/sources/demo:ro

      # Inventario Docker generado por el agente Ubuntu
      - type: bind
        source: /srv/copier-backup-manager/inventory
        target: /inventory
        read_only: true
        bind:
          create_host_path: false

    expose:
      - "8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=128m,mode=1777

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/bootstrap', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cbm_data:
  cbm_restores:
